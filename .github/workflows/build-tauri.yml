name: 构建 Tauri 桌面版并发布 Release

on:
  push:
    branches: [desktop]
    paths:
      - 'src/**'
      - 'server.ts'
      - 'webdav.ts'
      - 'satori.ts'
      - 'satori-ws.ts'
      - 'src-tauri/**'
      - 'scripts/build-server-bundle.mjs'
      - 'package.json'
      - '.github/workflows/build-tauri.yml'
  workflow_dispatch:

concurrency:
  group: tauri-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci --no-audit --no-fund

      - name: 构建前端 + server bundle
        run: |
          npm run build
          node scripts/build-server-bundle.mjs

      - name: 准备 sidecar 资源（node.exe + dist）
        shell: bash
        run: |
          set -e
          mkdir -p src-tauri/resources/dist
          cp dist/index.html src-tauri/resources/dist/
          cp -r dist/assets src-tauri/resources/dist/assets
          # node.exe 从 runner 自带 node 复制（版本与 setup-node 一致）
          NODE_EXE=$(which node.exe || where node | head -1)
          cp "$NODE_EXE" src-tauri/resources/node.exe
          ls -la src-tauri/resources/

      - name: 构建 Tauri（NSIS）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          args: --bundles nsis

      - name: 制作便携版（zip release 目录）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $rel = 'src-tauri/target/release'
          $stage = "portable/yunhulaoda-$ver-windows-x64-tauri-portable"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem $rel -File | Where-Object { $_.Extension -in '.exe','.dll' } | Copy-Item -Destination $stage
          # 资源目录布局兼容：release 根 或 release/resources
          if (Test-Path "$rel/resources") { Copy-Item -Recurse "$rel/resources" "$stage/resources" }
          foreach ($f in @('node.exe','server-bundle.mjs')) {
            if (Test-Path "$rel/$f") { Copy-Item "$rel/$f" "$stage/" }
          }
          if (Test-Path "$rel/dist") { Copy-Item -Recurse "$rel/dist" "$stage/dist" }
          Compress-Archive -Path "$stage/*" -DestinationPath "portable/yunhulaoda-$ver-windows-x64-tauri-portable.zip" -Force
          Get-ChildItem portable/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: yunhulaoda-tauri-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            portable/*.zip
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（gh release 需要 git 上下文）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 按发布规范重命名
        run: |
          set -e
          VER=$(node -p "require('./package.json').version")
          mkdir -p out
          # download-artifact 的 merge-multiple 会保留 LCA 相对目录结构，
          # 产物可能在 artifacts/src-tauri/... 或 artifacts/portable/... 下 —— 递归找
          EXE=$(find artifacts -type f -name '*.exe' | head -1 || true)
          ZIP=$(find artifacts -type f -name '*-tauri-portable.zip' | head -1 || true)
          echo "found exe: $EXE"
          echo "found zip: $ZIP"
          [ -n "$EXE" ] && cp "$EXE" "out/yunhulaoda-$VER-windows-x64-tauri-setup.exe"
          [ -n "$ZIP" ] && cp "$ZIP" out/
          ls -la out/
          [ -n "$EXE" ] || { echo "::error::no exe in artifacts"; exit 1; }

      - name: 发布到 Release（存在则覆盖上传，不删不重建）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" out/* --title "云湖牢大版 v$VER" --notes "见 docs/release-$VER.md"
          else
            gh release upload "$TAG" out/* --clobber
          fi
