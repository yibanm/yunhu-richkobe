name: 构建 Android APK 并发布版本 Release

on:
  push:
    branches: [android]
    paths:
      - 'src/**'
      - 'capacitor.config.ts'
      - 'build/android-res/**'
      - 'package.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 构建前端
        run: npm run build

      - name: 安装 Capacitor CLI
        run: npm i -g @capacitor/cli

      - name: 初始化 Capacitor Android
        run: npx cap add android

      - name: 同步 web 资源到 Android
        run: npx cap sync android

      - name: 注入品牌图标（mipmap 各密度）
        run: |
          set -e
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            DEST=android/app/src/main/res/mipmap-$d
            mkdir -p "$DEST"
            cp build/android-res/mipmap-$d/ic_launcher.png "$DEST/ic_launcher.png"
            cp build/android-res/mipmap-$d/ic_launcher_round.png "$DEST/ic_launcher_round.png"
          done
          echo "=== 注入结果 ==="
          ls -la android/app/src/main/res/mipmap-xxxhdpi/

      - name: 诊断：检查 web 资源是否打包进 APK
        run: |
          echo "=== assets/public 内容 ==="
          ls -la android/app/src/main/assets/public/ 2>&1 | head -20
          echo "=== index.html 是否存在 ==="
          ls -la android/app/src/main/assets/public/index.html 2>&1
          echo "=== AndroidManifest 里的 MainActivity exported ==="
          grep -A 3 "MainActivity" android/app/src/main/AndroidManifest.xml 2>&1 | head -10

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: 构建 debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: 重命名产物为约定命名
        run: |
          set -e
          VER=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/yunhulaoda-$VER-android-arm64.apk"
          ls -la out/

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: yunhulaoda-android
          path: out/*.apk
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（gh release 需要 git 上下文）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载 APK 产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 发布版本 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER"
          NOTES="云湖牢大版 v$VER（安卓端）· commit ${{ github.sha }}

          ## 产物
          - 安卓 APK：yunhulaoda-$VER-android-arm64.apk（debug 未签名，仅供测试）

          ## 构建方式
          GitHub Actions（.github/workflows/build-android.yml）：
          node 22 → npm ci → npm run build → cap add/sync android → 注入品牌 mipmap → JDK 21 + SDK 35 → assembleDebug。

          ## 已知问题
          - debug 包未签名；release 签名需自行提供 keystore（Secrets）。
          - 安装后打开，在「设置 → API 基址」里填你的云湖服务地址即可使用。

          ## 变更（自上一 tag）
          $(git log --oneline $(git describe --tags --abbrev=0 2>/dev/null || echo HEAD~30)..HEAD | head -50 || true)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "云湖牢大版 v$VER" --notes "$NOTES"
          fi
