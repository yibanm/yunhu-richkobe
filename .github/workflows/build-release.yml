name: 构建发布产物（Windows / Android）并发布 Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 构建前端
        run: npm run build

      - name: 打包 Windows（NSIS 安装版 + 便携 zip）
        run: npx electron-builder --publish never

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            release/yunhulaoda-*-windows-x64-setup.exe
            release/yunhulaoda-*-windows-x64.zip
          retention-days: 30

  android:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 构建前端并同步到 Android 工程
        run: |
          npm run build
          npx cap sync android

      - name: 设置 JDK 21（Capacitor 8 要求）
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 构建 release APK（arm64）
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: 按发布规范重命名
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk "yunhulaoda-${VER}-android-arm64.apk"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: yunhulaoda-*-android-arm64.apk
          retention-days: 30

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载所有平台产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 发布 Release（附源代码包说明）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -la artifacts/
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "云湖牢大版 ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --latest
