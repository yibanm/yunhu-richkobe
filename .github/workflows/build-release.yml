name: 构建发布产物（Flutter Windows / Android）并发布 Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    # 固定 windows-2022（VS 2022）：Flutter 3.35 的 VS 探测不识别 windows-2025 镜像的 VS 2026
    runs-on: windows-2022
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: stable
          cache: true

      - name: 拉依赖
        run: flutter pub get

      - name: 构建 Windows release
        run: flutter build windows --release

      - name: 打包安装器（Inno Setup）
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          # 版本注入 installer.iss
          (Get-Content installer.iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$ver`"" | Set-Content installer.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          Move-Item "Output\yunhulaoda-$ver-windows-x64-setup.exe" . -Force

      - name: 打包为 zip（便携版）
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "yunhulaoda-$ver-windows-x64.zip"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            yunhulaoda-*-windows-x64-setup.exe
            yunhulaoda-*-windows-x64.zip
          retention-days: 30

  android:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: stable
          cache: true

      - name: 设置 JDK 17（AGP 要求）
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 拉依赖
        run: flutter pub get

      - name: 构建 release APK（arm64）
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: 按发布规范重命名
        run: |
          set -e
          VER="${GITHUB_REF_NAME#v}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "yunhulaoda-${VER}-android-arm64.apk"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: yunhulaoda-*-android-arm64.apk
          retention-days: 30

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载所有平台产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 发布 Release（附源代码包说明）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -la artifacts/
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "云湖牢大版 ${GITHUB_REF_NAME}（Flutter 重写版）" \
            --notes-file RELEASE_NOTES.md \
            --latest
